x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      - ./logs:/app/logs
    logging: *default-logging

  caddy:
    build:
      context: ../chhaya-frontend-aws/web
      dockerfile_inline: |
        FROM node:22-alpine AS build
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci
        COPY . .
        ARG VITE_API_URL=/api
        ENV VITE_API_URL=$VITE_API_URL
        RUN npm run build
        FROM caddy:2
        COPY --from=build /app/dist /srv
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config: