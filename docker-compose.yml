x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
    volumes:
      - ./logs:/app/logs
    logging: *default-logging
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    logging: *default-logging
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: